<!DOCTYPE html>
<html>
<head>
<title>NG College</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

/* NAVBAR */
.navbar{
    position:sticky;
    top:0;
    background:#232F3E;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 18px;
    flex-wrap:wrap;
}

/* LOGO */
.logo{
    background:#FF9900;
    color:black;
    font-weight:bold;
    padding:8px 14px;
    border-radius:6px;
}

/* MENU */
.menu{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}

/* BUTTON STYLE */
.menu a, .menu button{
    text-decoration:none;
}

.menu button{
    background:#FF9900;
    border:none;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    transition:0.3s;
    color:white;
}

.menu button:hover{
    background:#e68a00;
    transform:scale(1.05);
}

/* DATE TIME */
#datetime{
    font-size:14px;
    opacity:0.9;
}

/* CONTENT */
.content{
    padding:20px;
    text-align:center;
}

/* HAMBURGER */
.hamburger{
    display:none;
    font-size:24px;
    cursor:pointer;
}

/* MOBILE */
@media (max-width:768px){

    .hamburger{
        display:block;
    }

    .menu{
        display:none;
        width:100%;
        flex-direction:column;
        margin-top:10px;
    }

    .menu.active{
        display:flex;
    }

    .menu button{
        width:100%;
        text-align:left;
    }

    #datetime{
        width:100%;
        margin-top:10px;
    }
}
</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <div class="logo">USB</div>

    <div class="hamburger" onclick="toggleMenu()">☰</div>

    <div class="menu" id="menu">

        <a href="extenial.html"><button>About Us</button></a>
        <button>AI Assistant</button>
        <button>Result</button>
        <a href="news.html"><button>News Update</button></a>
        <a href="attdence.html"><button>Attendance</button></a>
        <a href="libarary.html"><button>libaray</button>
        <div id="datetime"></div>
    </div>

</div>

<!-- CONTENT -->
<div class="content">
    <h2>Welcome to NG College Portal</h2>
</div>

<script>
function updateDateTime(){
    const now = new Date();
    document.getElementById("datetime").textContent =
        now.toLocaleDateString() + " | " + now.toLocaleTimeString();
}
setInterval(updateDateTime, 1000);
updateDateTime();

function toggleMenu(){
    document.getElementById("menu").classList.toggle("active");
}
</script>

</body>
</html>
