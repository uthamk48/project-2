<!DOCTYPE html>
<html>
<head>

<title>NG College</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background-color:#ffffff;
}

/* NAVBAR */
.navbar{
    background-color:#232F3E;
    padding:10px 15px;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

/* LOGO */
.logo{
    background-color:#FF9900;
    color:black;
    font-weight:bold;
    padding:10px 15px;
    border-radius:5px;
}

/* MENU */
.item{
    display:flex;
    gap:10px;
    list-style:none;
    padding:0;
    margin:10px 0;
    flex-wrap:wrap;
    justify-content:center;
}

/* BUTTONS */
button{
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background-color:#FF9900;
    color:white;
    box-shadow:0 4px 6px rgba(0,0,0,0.3);
    font-size:14px;
}

/* CONTENT (EMPTY SAFE AREA) */
.content{
    text-align:center;
    margin-top:30px;
    padding:10px;
    min-height:100px;
}

/* DATE TIME */
#datetime{
    font-size:14px;
    color:white;
}

/* 📱 MOBILE RESPONSIVE */
@media (max-width: 768px){

    .navbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .item{
        flex-direction:column;
        width:100%;
    }

    button{
        width:100%;
        font-size:16px;
    }
}
</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <div class="logo">USB</div>

    <ul class="item">
        <a href="extenial.html"><button>About us</button></a>
        <button>AI(Assistant)</button>
        <button>LIBRARY</button>
        <button>result</button>
        <a href="news.html"><button>news update</button></a>
        <a href="attdence.html"><button>Attendance</button></a>
        <a href="Digital_Library_Portal(1).html"><button>library </button>
    </ul>

    <div id="datetime"></div>

</div>

<!-- EMPTY CONTENT AREA -->
<div class="content">
</div>

<script>
function updateDateTime(){
    const now = new Date();
    document.getElementById("datetime").textContent =
        now.toLocaleDateString() + " | " + now.toLocaleTimeString();
}
setInterval(updateDateTime, 1000);
updateDateTime();
</script>

</body>
</html>
