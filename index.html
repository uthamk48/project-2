<!DOCTYPE html>
<html>
<head>
  <title>NG College Login</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family: Arial;
      background-color: #f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    form{
      background:white;
      border:2px solid black;
      border-radius:10px;
      padding:30px;
      width:90%;
      max-width:400px;
      text-align:center;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    h1{
      background-color:blue;
      color:white;
      padding:10px;
      border-radius:8px;
      font-size:22px;
    }

    h2{
      margin:15px 0;
    }

    input{
      width:90%;
      padding:10px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:5px;
    }

    button{
      width:95%;
      padding:12px;
      background-color:blue;
      color:white;
      border:none;
      border-radius:10px;
      font-size:16px;
      margin-top:10px;
      cursor:pointer;
    }

    button:hover{
      background-color:darkblue;
    }

    @media (max-width: 480px){
      form{
        padding:20px;
      }

      h1{
        font-size:18px;
      }
    }
  </style>
</head>

<body>

  <form>
    <h1>NG College</h1>
    <h2>LOGIN</h2>

    <h3>Name</h3>
    <input type="text" id="username" required>

    <h3>Hallticket</h3>
    <input type="text" id="hallticket" required>

    <button>Login</button>

    <div id="error" style="color:red;margin-top:10px;font-weight:bold;"></div>
  </form>

  <script>
    var students = [
      { name: "yelender", hallticket: "240440284681002" },
      { name: "Uthamkiran", hallticket: "240440284681086" },
      { name: "saibalji", hallticket: "240440284681031" },
      { name: "yogender", hallticket: "240440284681099" },
      { name: "k.himeshwar reddy", hallticket: "240440284681074" },
      { name: "AMAROJU SHIVA KUMAR", hallticket: "240440284681004" }
    ];

    document.querySelector("button").addEventListener("click", function(event){
      event.preventDefault();

      var name = document.getElementById("username").value.trim();
      var hall = document.getElementById("hallticket").value.trim();
      var error = document.getElementById("error");

      var found = students.some(s =>
        s.name.toLowerCase() === name.toLowerCase() &&
        s.hallticket === hall
      );

      if(found){
        window.location.href = "dashboard.html";
      } else {
        error.innerText = "Name or Hallticket is incorrect!";
      }
    });
  </script>

</body>
</html>
