<!DOCTYPE html>
<html>
<head>

<title>Basic News Update</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f2f2f2;
  padding: 15px;
  text-align: center;
  margin: 0;
}

/* HOME BUTTON */
a button {
  padding: 15px 25px;
  background-color: black;
  color: white;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-size: 16px;
  transition: 0.3s;
  margin: 15px 0;
  box-shadow: 0 6px 10px rgba(0,0,0,0.5);
  width: 90%;
  max-width: 300px;
}

a button:hover {
  transform: translateY(-3px);
}

/* TITLE */
h2 {
  color: #0078ff;
  font-size: 24px;
  margin-bottom: 20px;
}

/* NEWS BOX */
#news {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  max-width: 600px;
  margin: 0 auto;
  font-size: 18px;
  line-height: 1.6;
}

/* 📱 MOBILE */
@media (max-width: 768px){

  h2 {
    font-size: 20px;
  }

  #news {
    font-size: 16px;
    padding: 15px;
  }

  a button {
    font-size: 15px;
    padding: 12px;
  }
}
</style>

</head>

<body>

<!-- HOME -->
<a href="dashboard.html"><button>Home</button></a>

<!-- TITLE -->
<h2>Latest News</h2>

<!-- NEWS BOX -->
<p id="news">Loading news...</p>

<script>
let news = [
"A total of 563 posts were notified and 562 candidates have been provisionally selected.",
"Telangana PSC releases Group-I final results",
"MLR Institute of Technology hosts Smart India Hackathon 2025",
"Facial recognition system improves attendance in Telangana schools",
"DRDO RCI Paid Internship Recruitment 2025 – 160 Posts",
"Over 10,000 Overseas Job Openings announced in Gorakhpur Employment event",
"Emerging High-Paying Jobs in 2025 include AI and automation roles",
"Accenture is shifting focus toward AI and upskilling workforce",
"Maharashtra plans Global Competence Centre creating 4 lakh jobs"
];

let i = 0;

function showNews() {
  document.getElementById("news").innerText = news[i];
  i = (i + 1) % news.length;
}

showNews();
setInterval(showNews, 6000);
</script>

</body>
</html>
